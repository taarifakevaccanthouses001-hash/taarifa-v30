<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAARIFA KE - Find Vacant Houses</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Outfit',system-ui}
body{margin:0;background:#020617;color:#fff}
.header{background:#0f172a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;border-bottom:1px solid #1e293b}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}.logo span{color:#38bdf8}
.btn{padding:12px 18px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-primary{background:#2563eb;color:#fff;width:100%}
.btn-green{background:#16a34a;color:#fff;width:100%}
.btn-ghost{background:#1e293b;color:#fff}
.input{width:100%;padding:14px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#fff;margin:7px 0;font-size:15px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:18px;margin:12px}
.house-card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;overflow:hidden;margin:12px}
.house-card img{width:100%;height:190px;object-fit:cover}
.badge{background:#16a34a;color:#fff;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.price{font-size:22px;font-weight:900;color:#facc15}
.tabs{display:flex;gap:8px;background:#1e293b;padding:5px;border-radius:12px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.tab.active{background:#2563eb}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){#housesGrid{grid-template-columns:1fr 1fr 1fr;display:grid}}
.search-bar{position:sticky;top:56px;background:#020617;padding:12px;z-index:8}
.hero{padding:40px 20px;text-align:center;background:radial-gradient(600px at 50% 0%,#1e293b,#020617)}
.hero h1{font-size:38px;font-weight:900;line-height:0.9;margin:0}.hero h1 span{color:#38bdf8}
.hero p{color:#94a3b8}
</style>
</head>
<body>

<div class="header">
<div class="logo">TAARIFA<span>KE</span> V30</div>
<div style="display:flex;gap:8px;align-items:center">
<span id="userEmail" style="font-size:11px;color:#94a3b8" class="hidden"></span>
<button id="logoutBtn" class="hidden btn-ghost btn" style="padding:8px 12px" onclick="logout()">Logout</button>
</div>
</div>

<!-- AUTH -->
<div id="authPage">
<div class="hero">
<h1>Find Vacant<br><span>Houses</span> Fast</h1>
<p>Athi River • Kitengela • Mlolongo • Syokimau</p>
</div>
<div class="card" style="max-width:440px;margin:-20px auto 20px">
<div class="tabs">
<div id="tLogin" class="tab active" onclick="setAuth('login')">Login</div>
<div id="tReg" class="tab" onclick="setAuth('reg')">Create Account</div>
</div>

<div id="loginBox" style="margin-top:16px">
<input id="lEmail" class="input" placeholder="Email e.g. ookobrayan@gmail.com" type="email">
<input id="lPass" class="input" placeholder="Password" type="password">
<button class="btn btn-primary" onclick="doLogin()">Login to Taarifa Ke</button>
<p id="lMsg" style="color:#38bdf8;text-align:center"></p>
<p style="text-align:center;font-size:12px;color:#64748b;margin-top:12px">Demo: Use any email you created</p>
</div>

<div id="regBox" class="hidden" style="margin-top:16px">
<input id="rEmail" class="input" placeholder="Your Email" type="email">
<input id="rPhone" class="input" placeholder="Phone - M-Pesa Number 07...">
<input id="rPass" class="input" placeholder="Create Password (min 4)" type="password">
<input id="rPass2" class="input" placeholder="Confirm Password" type="password">
<button class="btn btn-green" onclick="doReg()">Create Account</button>
<p id="rMsg" style="color:#38bdf8;text-align:center"></p>
</div>
</div>
</div>

<!-- MAIN APP -->
<div id="appPage" class="hidden">
<div class="search-bar">
<input id="q" class="input" placeholder="🔍 Search by place, price, 1BR, Bedsitter..." oninput="render()">
<div class="grid" style="margin-top:8px">
<button class="btn btn-ghost" onclick="setFilter('All')">All</button>
<button class="btn btn-ghost" onclick="setFilter('1BR')">1BR</button>
<button class="btn btn-ghost" onclick="setFilter('2BR')">2BR</button>
<button class="btn btn-ghost" onclick="setFilter('Bedsitter')">Bedsitter</button>
</div>
</div>

<div class="card">
<h3 style="margin:0 0 10px">➕ Post Vacant House (Landlord)</h3>
<input id="hTitle" class="input" placeholder="House Title e.g. 1BR Great Wall Phase 2">
<div class="grid"><input id="hLoc" class="input" placeholder="Location e.g. Athi River"><input id="hPrice" class="input" type="number" placeholder="Rent KSh e.g. 8500"></div>
<div class="grid"><select id="hType" class="input"><option>1BR</option><option>2BR</option><option>Bedsitter</option><option>Single</option><option>3BR</option></select><input id="hContact" class="input" placeholder="Contact / M-Pesa"></div>
<input id="hImg" class="input" placeholder="Image URL (optional) - paste link">
<button class="btn btn-green" onclick="postHouse()">Post House Now - FREE</button>
</div>

<div id="housesGrid"></div>

<div class="card" style="background:#1e293b">
<h3 style="margin-top:0">📍 Popular Areas</h3>
<div class="grid">
<button class="btn btn-ghost" onclick="searchArea('Athi River')">Athi River</button>
<button class="btn btn-ghost" onclick="searchArea('Kitengela')">Kitengela</button>
<button class="btn btn-ghost" onclick="searchArea('Mlolongo')">Mlolongo</button>
<button class="btn btn-ghost" onclick="searchArea('Syokimau')">Syokimau</button>
</div>
<iframe style="width:100%;height:200px;border:none;border-radius:12px;margin-top:12px" src="https://maps.google.com/maps?q=Athi%20River&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

<div style="padding:20px;text-align:center;color:#475569;font-size:11px">
TAARIFA KE V30 • Made for Athi River • 2026<br>
M-Pesa • Airtel Money • Bank • Cash Accepted
</div>
</div>

<script>
// STORAGE
let users = JSON.parse(localStorage.getItem('tk_users')||'{}');
let houses = JSON.parse(localStorage.getItem('tk_houses')||'null') || [
{id:101,title:"1BR Great Wall Gardens - Tiled",location:"Athi River - Great Wall Phase 3",price:12500,type:"1BR",contact:"0712345678",owner:"admin@taarifa.ke",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800"},
{id:102,title:"Bedsitter Devki - Water 24/7",location:"Athi River - Devki Stage",price:6500,type:"Bedsitter",contact:"0722000001",owner:"landlord",img:"https://images.unsplash.com/photo-1502672023488-70e25813eb80?w=800"},
{id:103,title:"2BR Kitengela Milimani - Spacious",location:"Kitengela - Milimani Apartments",price:18000,type:"2BR",contact:"0798765432",owner:"landlord",img:"https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800"},
{id:104,title:"Single Room Mlolongo Phase 3",location:"Mlolongo - Phase 3 Behind 67",price:4000,type:"Single",contact:"0711223344",owner:"landlord",img:"https://images.unsplash.com/photo-1493809842364-78817add58d1?w=800"},
{id:105,title:"1BR Syokimau - Near SGR",location:"Syokimau - Katani Road",price:15000,type:"1BR",contact:"0700111222",owner:"landlord",img:"https://images.unsplash.com/photo-1560184611-6a68d14ec5c3?w=800"},
{id:106,title:"2BR Athi River - Daystar Area",location:"Athi River - Daystar",price:20000,type:"2BR",contact:"0733445566",owner:"landlord",img:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800"}
];
let curUser = localStorage.getItem('tk_cur');
let filter='All';

function save(){localStorage.setItem('tk_users',JSON.stringify(users));localStorage.setItem('tk_houses',JSON.stringify(houses))}

function setAuth(t){
 document.getElementById('loginBox').classList.toggle('hidden',t!=='login');
 document.getElementById('regBox').classList.toggle('hidden',t!=='reg');
 document.getElementById('tLogin').classList.toggle('active',t==='login');
 document.getElementById('tReg').classList.toggle('active',t==='reg');
}

function doReg(){
 let e=document.getElementById('rEmail').value.trim().toLowerCase();
 let p=document.getElementById('rPhone').value;
 let pw=document.getElementById('rPass').value;
 let pw2=document.getElementById('rPass2').value;
 let m=document.getElementById('rMsg');
 if(!e.includes('@')){m.innerText='❌ Valid email needed';return}
 if(pw.length<4){m.innerText='❌ Password min 4';return}
 if(pw!==pw2){m.innerText='❌ Passwords mismatch';return}
 if(users[e]){m.innerText='❌ Account exists, login';return}
 users[e]={email:e,phone:p,pass:pw,date:Date.now()};
 save(); m.innerText='✅ Account created! Login now'; setAuth('login'); document.getElementById('lEmail').value=e;
}

function doLogin(){
 let e=document.getElementById('lEmail').value.trim().toLowerCase();
 let pw=document.getElementById('lPass').value;
 let m=document.getElementById('lMsg');
 if(!users[e]){m.innerText='❌ No account, create one';return}
 if(users[e].pass!==pw){m.innerText='❌ Wrong password';return}
 localStorage.setItem('tk_cur',e); curUser=e; showApp();
}

function showApp(){
 document.getElementById('authPage').classList.add('hidden');
 document.getElementById('appPage').classList.remove('hidden');
 document.getElementById('userEmail').classList.remove('hidden');
 document.getElementById('logoutBtn').classList.remove('hidden');
 document.getElementById('userEmail').innerText=curUser;
 render();
}
function logout(){localStorage.removeItem('tk_cur');location.reload()}

function postHouse(){
 let title=document.getElementById('hTitle').value.trim();
 let loc=document.getElementById('hLoc').value.trim();
 let price=parseInt(document.getElementById('hPrice').value);
 let type=document.getElementById('hType').value;
 let contact=document.getElementById('hContact').value.trim()||users[curUser]?.phone||curUser;
 let img=document.getElementById('hImg').value.trim()||"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800";
 if(!title||!loc||!price){alert('Fill title, location, price');return}
 houses.unshift({id:Date.now(),title,location:loc,price,type,contact,owner:curUser,img});
 save(); render();
 document.getElementById('hTitle').value='';document.getElementById('hLoc').value='';document.getElementById('hPrice').value='';document.getElementById('hImg').value='';
 alert('✅ House Posted! Tenants will call you');
}

function setFilter(f){filter=f;render()}
function searchArea(a){document.getElementById('q').value=a;render()}

function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let list=houses.filter(h=>{
  let s=!q||h.title.toLowerCase().includes(q)||h.location.toLowerCase().includes(q)||h.type.toLowerCase().includes(q);
  let t=filter==='All'||h.type===filter;
  return s&&t;
 });
 document.getElementById('housesGrid').innerHTML=list.map(h=>`
 <div class="house-card">
  <img src="${h.img}" onerror="this.src='https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800'">
  <div style="padding:14px">
   <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">${h.type}</span><span style="font-size:11px;color:#64748b">${h.owner}</span></div>
   <h3 style="margin:10px 0 4px;font-size:16px">${h.title}</h3>
   <div style="color:#94a3b8;font-size:13px">📍 ${h.location}</div>
   <div class="price" style="margin:8px 0">KSh ${h.price.toLocaleString()} / month</div>
   <div style="display:flex;gap:8px">
    <a href="tel:${h.contact}" style="flex:1;text-decoration:none"><button class="btn btn-primary" style="width:100%">📞 ${h.contact}</button></a>
    <button class="btn btn-green" style="flex:1" onclick="alert('Pay KSh ${h.price} to M-Pesa ${h.contact} - House: ${h.title}')">M-Pesa</button>
   </div>
   ${h.owner===curUser?`<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:#ef4444" onclick="delHouse(${h.id})">Delete My Post</button>`:''}
  </div>
 </div>
 `).join('') || '<div class="card" style="text-align:center;color:#94a3b8">No houses found for '+q+'</div>';
}
function delHouse(id){if(confirm('Delete?')){houses=houses.filter(h=>h.id!==id);save();render()}}

// Auto login
if(curUser && users[curUser]) showApp();
</script>
</body>
</html>
